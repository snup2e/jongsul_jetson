<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Terra Live Monitor</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #14171c;
    --grid: #2a2e34;
    --axis: #4a525e;
    --text: #e8eaed;
    --muted: #888;
    --accent: #52b9ff;
    --warn: #f5a623;
    --err: #ff4d4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", system-ui, "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--grid);
    display: flex;
    gap: 28px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .title {
    font-weight: 600;
    font-size: 17px;
    margin-right: 12px;
  }
  .title .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    animation: pulse 1.4s infinite;
  }
  .title.idle .dot { background: var(--muted); animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .stat {
    display: flex;
    flex-direction: column;
    min-width: 90px;
  }
  .stat .label {
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 2px;
  }
  .stat .value {
    font-size: 18px;
    font-variant-numeric: tabular-nums;
  }
  .stat .value.warn { color: var(--warn); }
  .stat .value.err  { color: var(--err); }
  #canvas-wrap {
    padding: 16px 20px 4px;
  }
  canvas {
    width: 100%;
    height: 420px;
    background: var(--panel);
    border-radius: 10px;
    display: block;
  }
  .footer {
    padding: 6px 20px 16px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<header>
  <div class="title" id="title"><span class="dot"></span>Terra Live Monitor</div>
  <div class="stat"><span class="label">Elapsed</span><span class="value" id="elapsed">0.0 s</span></div>
  <div class="stat"><span class="label">RMS</span><span class="value" id="rms">0.00 mV</span></div>
  <div class="stat"><span class="label">Peak</span><span class="value" id="peak">0.00 mV</span></div>
  <div class="stat"><span class="label">Headroom</span><span class="value" id="head">100 %</span></div>
  <div class="stat"><span class="label">Frames OK</span><span class="value" id="frames">0</span></div>
  <div class="stat"><span class="label">Drops / Resets</span><span class="value" id="drops">0 / 0</span></div>
  <div class="stat"><span class="label">SPS</span><span class="value" id="sps">0</span></div>
</header>
<div id="canvas-wrap"><canvas id="plot"></canvas></div>
<div class="footer">
  <span>last 5 seconds · auto y-scale · 1 kHz display (raw 15 kHz)</span>
  <span id="conn">connecting…</span>
</div>
<script>
  const canvas = document.getElementById('plot');
  const ctx = canvas.getContext('2d');
  const WINDOW_S = 5.0;
  let buffer = [];          // {t, v} ascending in t
  let yScale = 5.0;          // current displayed ±mV extent
  let tNow = 0;

  function fitCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const r = canvas.getBoundingClientRect();
    canvas.width  = Math.max(1, Math.floor(r.width  * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  function ingest(arr) {
    if (!arr || !arr.length) return;
    for (const item of arr) {
      // item is [t, v]
      buffer.push({ t: item[0], v: item[1] });
    }
    tNow = buffer[buffer.length - 1].t;
    const cutoff = tNow - WINDOW_S;
    // drop in-place from the left
    let drop = 0;
    while (drop < buffer.length && buffer[drop].t < cutoff) drop++;
    if (drop > 0) buffer.splice(0, drop);
  }

  function updateStats(s) {
    if (!s) return;
    document.getElementById('elapsed').textContent = s.elapsed.toFixed(1) + ' s';
    document.getElementById('rms').textContent    = s.rms_mv.toFixed(2) + ' mV';
    document.getElementById('peak').textContent   = s.peak_mv.toFixed(2) + ' mV';

    const h = document.getElementById('head');
    h.textContent = Math.round(s.headroom_pct) + ' %';
    h.className = 'value' + (s.headroom_pct < 20 ? ' err'
                            : s.headroom_pct < 50 ? ' warn'
                            : '');

    document.getElementById('frames').textContent = s.frames_ok.toLocaleString();

    const d = document.getElementById('drops');
    d.textContent = s.seq_drops + ' / ' + s.resets;
    d.className = 'value' + ((s.seq_drops > 0 || s.resets > 1) ? ' err'
                            : (s.resets > 0 ? ' warn' : ''));

    document.getElementById('sps').textContent = Math.round(s.sps).toLocaleString();
  }

  let es = null;
  function connect() {
    if (es) { try { es.close(); } catch(e){} }
    es = new EventSource('/stream');
    es.onopen = () => {
      document.getElementById('conn').textContent = 'streaming';
      document.getElementById('title').classList.remove('idle');
    };
    es.onmessage = (e) => {
      let d;
      try { d = JSON.parse(e.data); } catch (err) { return; }
      if (d.done) {
        es.close();
        document.getElementById('conn').textContent = 'stopped';
        document.getElementById('title').classList.add('idle');
        return;
      }
      if (d.snapshot)  ingest(d.snapshot);
      if (d.samples)   ingest(d.samples);
      if (d.stats)     updateStats(d.stats);
    };
    es.onerror = () => {
      document.getElementById('conn').textContent = 'disconnected · retrying';
      document.getElementById('title').classList.add('idle');
      setTimeout(connect, 1500);
    };
  }
  connect();

  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--panel');
    ctx.fillRect(0, 0, w, h);

    // gridlines
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
    ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
      const x = i * w / 5;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let i = 1; i < 4; i++) {
      const y = i * h / 4;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // zero line
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--axis');
    ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();

    if (!buffer.length) {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted');
      ctx.font = '13px monospace';
      ctx.fillText('waiting for samples…', 14, 20);
      return;
    }

    // y auto-scale (smoothed) based on visible window
    const tMax = tNow;
    const tMin = tMax - WINDOW_S;
    let yPeak = 0;
    for (const p of buffer) {
      const a = Math.abs(p.v);
      if (a > yPeak) yPeak = a;
    }
    const target = Math.max(yPeak * 1.15, 0.5);
    yScale = yScale * 0.9 + target * 0.1;

    // axis labels
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted');
    ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillText('+' + yScale.toFixed(2) + ' mV', 8, 14);
    ctx.fillText('-' + yScale.toFixed(2) + ' mV', 8, h - 6);
    ctx.fillText('0', 8, h/2 - 4);
    ctx.fillText('-5s', 8, h - 22);
    ctx.fillText('now', w - 28, h - 22);

    // waveform
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    let first = true;
    for (const p of buffer) {
      const x = (p.t - tMin) / WINDOW_S * w;
      const y = h/2 - p.v / yScale * (h/2 * 0.92);
      if (first) { ctx.moveTo(x, y); first = false; }
      else       ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  setInterval(draw, 33);  // 30 Hz redraw — smooth even if SSE pauses
</script>
</body>
</html>
